# esbuild ships its platform binary via the optional @esbuild/* packages;
# its postinstall only validates it, so it does not need to run here.
allowBuilds:
  esbuild: false

overrides:
  # path-to-regexp@6.1.0 is pinned by @vercel/routing-utils (via
  # @astrojs/vercel) and is flagged by GHSA-9wv6-86v2-598j (backtracking
  # regular expressions). This was an npm `overrides` entry in package.json,
  # which pnpm ignores — moved here after the pnpm migration. Scoped to the
  # 6.x copy; the caret keeps it below 7. Drop once routing-utils moves on.
  path-to-regexp@6: "^6.3.0"
